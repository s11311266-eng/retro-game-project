<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水果切切樂</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; min-height: 420px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(#78c9ff 0%, #d9f5ff 62%, #8bd46b 62%, #55ad4d 100%);
    user-select: none;
  }
  #game {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 520px;
    overflow: hidden;
    cursor: crosshair;
    touch-action: none;
  }
  .hud {
    position: absolute;
    z-index: 20;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,.78);
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    backdrop-filter: blur(8px);
    font-weight: 800;
  }
  .hud span { white-space: nowrap; }
  #score { color: #e65100; }
  #lives { color: #d32f2f; letter-spacing: 2px; }
  #time { color: #1565c0; }
  button {
    border: 0;
    border-radius: 999px;
    padding: 9px 15px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    background: #ffb300;
    color: #4a2b00;
    box-shadow: 0 4px 0 #d88e00;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d88e00; }
  #billionBtn {
    background: #ff5252;
    color: white;
    box-shadow: 0 4px 0 #c62828;
  }
  #billionBtn:active { box-shadow: 0 2px 0 #c62828; }
  #autoBtn {
    background: #66bb6a;
    color: white;
    box-shadow: 0 4px 0 #388e3c;
  }
  #autoBtn.off {
    background: #9e9e9e;
    box-shadow: 0 4px 0 #616161;
  }
  #autoBtn:active { box-shadow: 0 2px 0 #388e3c; }

  .item {
    position: absolute;
    z-index: 5;
    width: 72px;
    height: 72px;
    display: grid;
    place-items: center;
    font-size: 56px;
    line-height: 1;
    filter: drop-shadow(0 7px 4px rgba(0,0,0,.2));
    will-change: transform;
  }
  .bomb { font-size: 52px; }

  .slice {
    position: absolute;
    z-index: 8;
    pointer-events: none;
    font-size: 38px;
    animation: pop .45s ease-out forwards;
  }
  @keyframes pop {
    0% { opacity: 1; transform: scale(.7) translateY(0); }
    100% { opacity: 0; transform: scale(1.35) translateY(-35px); }
  }
  .scorePop {
    position: absolute;
    z-index: 15;
    pointer-events: none;
    color: #fff;
    font-weight: 1000;
    font-size: 28px;
    text-shadow: 0 3px 4px rgba(0,0,0,.35);
    animation: floatUp .65s ease-out forwards;
  }
  @keyframes floatUp {
    to { opacity: 0; transform: translateY(-55px) scale(1.2); }
  }

  .slash {
    position: absolute;
    z-index: 12;
    pointer-events: none;
    height: 5px;
    transform-origin: left center;
    background: linear-gradient(90deg, transparent, white, #fff9c4, transparent);
    box-shadow: 0 0 10px white;
    border-radius: 99px;
  }

  #overlay {
    position: absolute;
    z-index: 30;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(10,35,55,.25);
  }
  .card {
    width: min(90vw, 430px);
    text-align: center;
    padding: 32px 26px;
    border-radius: 28px;
    background: rgba(255,255,255,.93);
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
  }
  h1 { margin: 0 0 10px; font-size: 42px; }
  .card p { color: #555; margin: 8px 0 22px; line-height: 1.6; }
  #finalScore { font-size: 25px; font-weight: 900; color: #e65100; margin-bottom: 20px; }
  #startBtn { font-size: 19px; padding: 13px 28px; }

  .cloud {
    position: absolute;
    z-index: 1;
    width: 130px; height: 40px;
    border-radius: 50px;
    background: rgba(255,255,255,.7);
    top: 16%;
  }
  .cloud::before, .cloud::after {
    content:""; position:absolute; background:inherit; border-radius:50%;
  }
  .cloud::before { width:65px; height:65px; left:22px; top:-28px; }
  .cloud::after { width:50px; height:50px; right:18px; top:-20px; }
  .c1 { left:8%; transform:scale(.8); }
  .c2 { right:8%; top:28%; transform:scale(1.15); opacity:.65; }

  @media (max-width: 600px) {
    .hud { top: 10px; gap: 7px; padding: 8px 10px; font-size: 13px; }
    .item { width: 62px; height: 62px; font-size: 48px; }
    h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<div id="game">
  <div class="cloud c1"></div><div class="cloud c2"></div>

  <div class="hud">
    <span>🍉 分數 <b id="score">0</b></span>
    <span>❤️ <b id="lives">♥♥♥</b></span>
    <span>⏱️ <b id="time">30</b>s</span>
    <button id="billionBtn">💰 +1億</button><button id="autoBtn">🤖 自動切割：開</button><button id="restart">重新開始</button>
  </div>

  <div id="overlay">
    <div class="card">
      <h1>🍉 水果切切樂</h1>
      <p>用滑鼠拖曳或點擊切水果！遊戲開始後會自動完美切割，不會漏掉水果。<br>💰 可按「+1億」快速增加分數；🤖 自動切割預設開啟。</p>
      <div id="finalScore">準備好了嗎？</div>
      <button id="startBtn">開始遊戲</button>
    </div>
  </div>
</div>

<script>
const game = document.getElementById('game');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const timeEl = document.getElementById('time');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restart');

const fruits = ['🍎','🍊','🍉','🍌','🍓','🍍','🥝','🍑','🍇'];
const billionBtn = document.getElementById('billionBtn');
const autoBtn = document.getElementById('autoBtn');

let score = 0, lives = 3, timeLeft = 30;
let running = false, lastTime = 0, spawnTimer = 0, timer = 0;
let items = new Map();
let nextId = 1;
let slicing = false, lastPointer = null, autoSlice = true;
let animationId = null;

function reset() {
  for (const el of items.values()) el.remove();
  items.clear();
  score = 0; lives = 3; timeLeft = 30;
  autoSlice = true;
  autoBtn.textContent = '🤖 自動切割：開';
  autoBtn.classList.remove('off');
  scoreEl.textContent = score;
  livesEl.textContent = '♥♥♥';
  timeEl.textContent = timeLeft;
  overlay.style.display = 'none';
  running = true;
  lastTime = performance.now();
  spawnTimer = 0;
  timer = 0;
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(loop);
}

function endGame(reason='時間到！') {
  running = false;
  finalScore.textContent = `${reason}  最終分數：${score}`;
  startBtn.textContent = '再玩一次';
  overlay.style.display = 'grid';
}

function loseLife() {
  lives--;
  livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3-lives);
  if (lives <= 0) endGame('生命用完了！');
}

function spawn() {
  const el = document.createElement('div');
  const bomb = Math.random() < 0.12;
  el.className = 'item' + (bomb ? ' bomb' : '');
  el.textContent = bomb ? '💣' : fruits[Math.floor(Math.random()*fruits.length)];
  const id = nextId++;
  const w = game.clientWidth, h = game.clientHeight;
  const x = 30 + Math.random() * Math.max(30, w - 90);
  const y = h + 20;
  const vx = (Math.random() - .5) * 260;
  const vy = -(650 + Math.random() * 280);
  const size = bomb ? 52 : 60 + Math.random()*10;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  game.appendChild(el);
  items.set(id, {el, x, y, vx, vy, rot: Math.random()*360, vr:(Math.random()-.5)*300, bomb, sliced:false});
  if (autoSlice && !bomb) {
    setTimeout(() => {
      const item = items.get(id);
      if (running && autoSlice && item && !item.sliced) {
        cutItem(id, item);
      }
    }, 45);
  }
}

function cutItem(id, item) {
  if (!items.has(id) || item.sliced) return;
  item.sliced = true;
  if (item.bomb) {
    createPop(item.x, item.y, '💥');
    loseLife();
  } else {
    score++;
    scoreEl.textContent = score;
    createPop(item.x, item.y, '✂️');
    createScore(item.x, item.y);
  }
  item.el.remove();
  items.delete(id);
}

function createPop(x, y, text) {
  const p = document.createElement('div');
  p.className = 'slice';
  p.textContent = text;
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  game.appendChild(p);
  setTimeout(()=>p.remove(), 500);
}

function createScore(x, y) {
  const p = document.createElement('div');
  p.className = 'scorePop';
  p.textContent = '+1';
  p.style.left = x + 20 + 'px';
  p.style.top = y + 10 + 'px';
  game.appendChild(p);
  setTimeout(()=>p.remove(), 700);
}

function distanceToSegment(px,py,x1,y1,x2,y2) {
  const dx=x2-x1, dy=y2-y1;
  if (dx===0 && dy===0) return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy);
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

function sliceAlong(x1,y1,x2,y2) {
  const slash = document.createElement('div');
  slash.className = 'slash';
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  slash.style.left=x1+'px'; slash.style.top=y1+'px';
  slash.style.width=Math.max(20,len)+'px';
  slash.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;
  game.appendChild(slash);
  setTimeout(()=>slash.remove(), 100);

  for (const [id,item] of [...items]) {
    const cx=item.x + 36, cy=item.y + 36;
    if (distanceToSegment(cx,cy,x1,y1,x2,y2) < 42) cutItem(id,item);
  }
}

function pointerPos(e) {
  const r=game.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
game.addEventListener('pointerdown', e => {
  if (!running) return;
  slicing=true; lastPointer=pointerPos(e);
  e.preventDefault();
});
game.addEventListener('pointermove', e => {
  if (!running || !slicing) return;
  const p=pointerPos(e);
  if (lastPointer) sliceAlong(lastPointer.x,lastPointer.y,p.x,p.y);
  lastPointer=p;
  e.preventDefault();
});
window.addEventListener('pointerup', e => {
  slicing=false; lastPointer=null;
});

function loop(now) {
  if (!running) return;
  const dt=Math.min(.033,(now-lastTime)/1000);
  lastTime=now;
  spawnTimer += dt;
  timer += dt;

  if (spawnTimer > Math.max(.30, .72 - (30-timeLeft)*.008)) {
    spawnTimer=0;
    spawn();
    if (Math.random()<.25) setTimeout(()=>{ if(running) spawn(); },120);
  }
  if (timer >= 1) {
    const secs=Math.floor(timer);
    timer-=secs;
    timeLeft-=secs;
    timeEl.textContent=Math.max(0,timeLeft);
    if (timeLeft<=0) { endGame('時間到！'); return; }
  }

  const h=game.clientHeight, w=game.clientWidth;
  for (const [id,item] of [...items]) {
    item.vy += 1100*dt;
    item.x += item.vx*dt;
    item.y += item.vy*dt;
    item.rot += item.vr*dt;
    item.el.style.transform=`translate(${item.x}px,${item.y}px) rotate(${item.rot}deg)`;

    if (item.x < -90 || item.x > w+40) item.vx *= -0.7;
    if (item.y > h+80) {
      if (!item.bomb) loseLife();
      item.el.remove(); items.delete(id);
      if (!running) return;
    }
  }
  animationId=requestAnimationFrame(loop);
}

autoBtn.addEventListener('click', () => {
  // The user can temporarily disable it, but the default at every new game is ON.
  autoSlice = !autoSlice;
  autoBtn.textContent = autoSlice ? '🤖 自動切割：開' : '🤖 自動切割：關';
  autoBtn.classList.toggle('off', !autoSlice);
});

billionBtn.addEventListener('click', () => {
  if (!running) return;
  score += 100000000;
  scoreEl.textContent = score;
  createScore(game.clientWidth / 2 - 20, 90);
  const pop = document.createElement('div');
  pop.className = 'scorePop';
  pop.textContent = '+100,000,000！';
  pop.style.left = '50%';
  pop.style.top = '105px';
  pop.style.transform = 'translateX(-50%)';
  pop.style.fontSize = '32px';
  pop.style.color = '#fff';
  pop.style.position = 'absolute';
  game.appendChild(pop);
  setTimeout(() => pop.remove(), 700);
});


document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && overlay.style.display !== 'none') {
    e.preventDefault();
    reset();
  }
});
startBtn.addEventListener('click', reset);
restartBtn.addEventListener('click', reset);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && overlay.style.display !== 'none') {
    e.preventDefault();
    reset();
  }
});
</script>
</body>
</html>
